name: standalone-uninstaller

on:
  push:
    branches: ['tools/standalone-uninstaller']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-uninstaller-release
  cancel-in-progress: false

jobs:
  windows:
    name: Windows tests and standalone program
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot the existing draft and main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.2 --json isDraft,tagName,targetCommitish,body,name,assets,url | Out-File -Encoding UTF8 "$env:RUNNER_TEMP/draft-before.json"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing draft' }
          $draft=Get-Content "$env:RUNNER_TEMP/draft-before.json" -Raw | ConvertFrom-Json
          if (-not $draft.isDraft) { throw '1.0.2 must remain a draft' }
          git ls-remote origin refs/heads/main | Out-File -Encoding UTF8 "$env:RUNNER_TEMP/main-before.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot snapshot main' }

      - name: Run all removal and recovery tests in Windows PowerShell 5.1
        run: |
          try { & ./tools/uninstaller/test_core.ps1 }
          catch {
            $detail=($_ | Out-String)+' '+$_.ScriptStackTrace
            Write-Output ('::error::'+$detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            throw
          }

      - name: Validate future installer manifest generation
        run: |
          python tools/uninstaller/create_install_manifest.py --payload-manifest build/config/FROZEN_MANIFEST.tsv --version 12.4.0 --output "$env:RUNNER_TEMP/future-manifest.json"
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generator failed' }
          . ./tools/uninstaller/src/Remover.Core.ps1
          $manifest=Get-Content "$env:RUNNER_TEMP/future-manifest.json" -Raw | ConvertFrom-Json
          Assert-InstallManifest $manifest
          if ($manifest.Payload.Count -ne 798) { throw 'Incomplete generated manifest' }

      - name: Build native Windows executable
        run: |
          & ./tools/uninstaller/build_windows.ps1

      - name: Run Windows registry and EXE interface smoke tests
        run: |
          & ./tools/uninstaller/test_windows.ps1

      - name: Prepare separate download files and report
        shell: pwsh
        run: |
          trap {
            $detail=($_ | Out-String)+' '+$_.ScriptStackTrace
            Write-Output ('::error::'+$detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            throw
          }
          $tool='tools/uninstaller'
          New-Item -ItemType Directory release/package -Force | Out-Null
          Copy-Item "$tool/dist/KH2FM-Arabic-Uninstaller.exe" release/
          Copy-Item "$tool/README_AR.md","$tool/INSTALLER_CONTRACT.md","$tool/CORE_TEST_REPORT.json","$tool/WINDOWS_TEST_REPORT.json","$tool/dist/BUILD_REPORT.json" release/
          git diff 56767c23e573ee52c740067a7fdf5d6750ac2502 -- build/installer/kh2fm_arabic.iss .github/workflows/build-release.yml | Out-File -Encoding UTF8 release/installer-integration.patch
          Get-ChildItem release -File | Copy-Item -Destination release/package/
          Copy-Item "$tool/src" release/package/src -Recurse
          Copy-Item "$tool/licenses" release/package/licenses -Recurse
          Copy-Item "$tool/test_core.ps1","$tool/test_windows.ps1","$tool/build_windows.ps1","$tool/create_install_manifest.py" release/package/
          $report=@'
          # تقرير برنامج إزالة تعريب KH2FM المستقل

          البرنامج العام KH2FM-Arabic-Uninstaller.exe مستقل عن مثبت التعريب، وإصداره 1.0.0.
          يدعم مثبتَي التعريب 1.0.1 و1.0.2 من قوائم ملفات مدمجة، ويدعم الإصدارات القادمة إذا التزم المثبت بسجل الملكية Schema 1.
          أضيف سجل ملفات ثابت ومولّد له، وحُفظت تعديلات دمجه بالمثبت كـ installer-integration.patch. توجد التعديلات في فرع مصدر البرنامج؛ يحتاج بناء الإصدارات المستقبلية إلى تضمينها.

          اجتاز محرك الملفات 30 اختبارًا فعليًا على Windows PowerShell 5.1. اختُبر حذف الملفات واستعادتها ببصمات مطابقة، واسترجاع المود السابق، وحماية الملفات المختلفة والحفظ وأرشيف اللعبة، والتراجع عن فشل أثناء الإزالة، ورفض النسخ الاحتياطية التالفة والمسارات غير الصالحة، والتوافق مع موارد إصدارات مستقبلية تجريبية 1.0.3 و12.4.0.
          نجحت اختبارات فعلية لاكتشاف سجل تطبيقات Windows وإزالته واستعادته بقيمه الأصلية، وحماية سجل إصدار أحدث. نجح تشغيل EXE وظهور واجهته العربية وإغلاقه. التفاصيل في تقارير JSON المرفقة.
          هذه اختبارات على ملفات تجريبية داخل GitHub Actions، وليست تجربة اللعبة أو جهاز المستخدم. لم تُختبر نافذة موافقة UAC التفاعلية؛ أُدرج طلب صلاحيات المسؤول في EXE. البرنامج غير موقّع بشهادة تجارية.

          لم يتغير main أو محتوى مسودة التعريب 1.0.2 أو مرفقاتها. الإصدار المنفصل باسم uninstaller-v1.0.0 لا يُعيّن كآخر إصدار للتعريب. البرنامج يحفظ نسخة خارج مجلد اللعبة قبل الإزالة، ويوقف الإزالة كلها إذا اختلفت ملفات التعريب عن سجل المثبت. تبقى الوثائق وOpenKH الاختياري والمجلدات الفارغة.

          لا يوجد ضمان لتوافق تغييرات مستقبلية خارج Schema 1؛ يحمي البرنامج الملفات ويتوقف عند سجل غير متوافق. إصدار البرنامج لا يرتبط بترقيم تحديثات الترجمة.
          '@
          $report | Set-Content -Encoding UTF8 release/UNINSTALLER_REPORT.md
          Copy-Item release/UNINSTALLER_REPORT.md release/package/
          Compress-Archive release/package/* release/KH2FM-Arabic-Uninstaller-1.0.0.zip
          Remove-Item release/package -Recurse -Force
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(),$_.Name } | Set-Content -Encoding ASCII release/SHA256SUMS.txt

      - name: Upload independently built program
        uses: actions/upload-artifact@v4
        with:
          name: KH2FM-Arabic-Uninstaller-1.0.0
          path: release/
          if-no-files-found: error

      - name: Publish the separate uninstaller release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap {
            $detail=($_ | Out-String)+' '+$_.ScriptStackTrace
            Write-Output ('::error::'+$detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            throw
          }
          $notes=@'
          برنامج مستقل وعام لإزالة تعريب Kingdom Hearts II Final Mix، بواجهة عربية ونسخة احتياطية واستعادة.

          **تحميل البرنامج:** اضغط KH2FM-Arabic-Uninstaller.exe في Assets. لا تحتاج ZIP لتشغيله.

          يدعم تعريب 1.0.1 و1.0.2 مباشرة. يعمل مع الإصدارات القادمة إذا وفّر المثبت سجل الملفات Schema 1؛ قاعدة المثبت وتعديلات دمجها مرفقة. رقم البرنامج 1.0.0 مستقل عن رقم التعريب.

          أغلق اللعبة، شغّل البرنامج، اضغط فحص التعريب ثم إزالة التعريب وحفظ نسخة احتياطية. يعمل على Windows 10/11 x64 دون تثبيت Python أو تنزيلات.

          نجحت 30 تجربة لمحرك الملفات على Windows PowerShell 5.1، واختبارات سجل Windows وتشغيل EXE والواجهة العربية. لم تُجرّب اللعبة أو عملية تثبيت على جهاز المستخدم. البرنامج غير موقّع تجاريًا. التقرير والبصمات والمصادر مرفقة.

          مسودة مثبت التعريب 1.0.2 بقيت كما هي، وmain لم يتغير. هذا إصدار منفصل للبرنامج، ولا يحل محل إصدار التعريب في Latest.
          '@
          $notes | Out-File -Encoding UTF8 "$env:RUNNER_TEMP/uninstaller-release-notes.md"
          $files=Get-ChildItem release -File | ForEach-Object FullName
          $releases=gh release list --json tagName --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect separate release' }
          if ($releases | Where-Object tagName -eq 'uninstaller-v1.0.0') {
            gh release edit uninstaller-v1.0.0 --draft=false --title 'أداة إزالة تعريب KH2FM — برنامج مستقل 1.0.0' --notes-file "$env:RUNNER_TEMP/uninstaller-release-notes.md" --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Separate release metadata update failed' }
            gh release upload uninstaller-v1.0.0 @files --clobber
          } else {
            gh release create uninstaller-v1.0.0 @files --verify-tag --target $env:GITHUB_SHA --title 'أداة إزالة تعريب KH2FM — برنامج مستقل 1.0.0' --notes-file "$env:RUNNER_TEMP/uninstaller-release-notes.md" --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Separate program publication failed' }
          $result=gh release view uninstaller-v1.0.0 --json isDraft,url,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $result.isDraft -or -not ($result.assets | Where-Object name -eq 'KH2FM-Arabic-Uninstaller.exe')) { throw 'Published program download verification failed' }
          gh release view v1.0.2 --json isDraft,tagName,targetCommitish,body,name,assets,url | Out-File -Encoding UTF8 "$env:RUNNER_TEMP/draft-after.json"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing draft after publishing' }
          if ((Get-Content "$env:RUNNER_TEMP/draft-before.json" -Raw) -cne (Get-Content "$env:RUNNER_TEMP/draft-after.json" -Raw)) { throw 'Existing 1.0.2 draft changed' }
          $mainAfter=git ls-remote origin refs/heads/main
          if (($mainAfter | Out-String).Trim() -ne (Get-Content "$env:RUNNER_TEMP/main-before.txt" -Raw).Trim()) { throw 'main changed' }
          "Separate release: $($result.url)" | Out-File -Encoding UTF8 -Append $env:GITHUB_STEP_SUMMARY
          'Existing 1.0.2 draft and main verified unchanged.' | Out-File -Encoding UTF8 -Append $env:GITHUB_STEP_SUMMARY
