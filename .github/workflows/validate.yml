name: validate

on:
  pull_request:
    paths:
      - 'corrections/**'
      - 'tools/**'
      - 'tests/**'
      - 'RULES.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validator tests
        run: python -m unittest discover -s tests -v

      - name: Validate corrections
        run: python tools/validate_corrections.py
