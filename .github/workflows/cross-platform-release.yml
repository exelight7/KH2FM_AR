name: KH2FM 1.0.9 — Windows Linux
on:
  push:
    branches: ['installer/**']
    paths: ['apps/manager/**', 'build/tools/*manager_release.py', '.github/workflows/cross-platform-release.yml', 'docs/releases/1.0.9.md', 'experiments/fonts/alef-spacing/**', 'experiments/fonts/outline-baseline/**', 'experiments/fonts/dialogue-size/**', 'experiments/fonts/natural-proportions/**', 'experiments/fonts/clean-joins/**', 'build/tools/replace_drive_hud.py', 'build/tools/*font*.py', 'corrections/**', 'build/docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kh2fm-draft-1-0-9
  cancel-in-progress: true
env:
  VERSION: '1.0.9'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
jobs:
  payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the translation and download its frozen sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_corrections.py > validation.txt
          tail -n 3 validation.txt
          gh release download build-payload -p build-payload-1.0.0-beta.zip -D "$RUNNER_TEMP" -R "$GITHUB_REPOSITORY"
          mkdir -p build/payload
          unzip -q "$RUNNER_TEMP/build-payload-1.0.0-beta.zip" -d build/payload
          python build/tools/verify_payload.py build/payload
          python build/tools/selftest.py build/payload/kh2/msg/us
          python build/tools/build_bars.py --payload build/payload --version "$VERSION"
          python -m pip install Pillow==12.3.0 numpy==2.5.3
          python experiments/fonts/outline-baseline/sources/fix_font.py --verify
          python experiments/fonts/dialogue-size/sources/scale_font.py --verify
          python experiments/fonts/natural-proportions/sources/build_font.py --verify
          python experiments/fonts/clean-joins/sources/build_font.py --verify
          python build/tools/merge_font_overlay.py
          python build/tools/replace_drive_hud.py
          python build/tools/fetch_panacea.py
          python apps/manager/scripts/pack_payload.py > PAYLOAD_PACK.json
          cat PAYLOAD_PACK.json
      - uses: actions/upload-artifact@v4
        with:
          name: manager-data
          compression-level: 0
          path: |
            apps/manager/data/
            build/report/
            PAYLOAD_PACK.json
          if-no-files-found: error
  apps:
    needs: payload
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win32, arch: x64, target: '--win --x64'}
          - {os: ubuntu-24.04, platform: linux, arch: x64, target: '--linux --x64'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/manager/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: manager-data
          path: prepared
      - name: Restore the verified translation resources
        run: |
          mkdir -p data test-results
          cp ../../prepared/apps/manager/data/* data/
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Files, legacy upgrades, rollback, recovery and Wine registry tests
        run: node scripts/run_checked.cjs npm test
      - name: Native application button tests (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/run_checked.cjs npm run test:native
      - name: Native application button tests (Windows and macOS)
        if: matrix.platform != 'linux'
        run: node scripts/run_checked.cjs npm run test:native
      - name: Build the downloadable application
        run: node scripts/run_checked.cjs npm run dist -- ${{ matrix.target }}
      - name: Exercise the packaged application and all 798 actual mod files (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/run_checked.cjs node tests/packaged.cjs
      - name: Exercise the packaged application and all 798 actual mod files (Windows and macOS)
        if: matrix.platform != 'linux'
        run: node scripts/run_checked.cjs node tests/packaged.cjs
      - name: Collect downloads and actual application evidence
        run: python ../../build/tools/collect_manager_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 0
          path: apps/manager/release-output/
          if-no-files-found: error
  draft:
    needs: [payload, apps]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: manager-data
          path: prepared
      - name: Collect documentation and calculate asset hashes
        run: |
          cp apps/manager/README_AR.md release/
          cp apps/manager/REPORT_1.0.9.md release/
          cp experiments/fonts/clean-joins/comparison-*.png release/
          cp prepared/build/report/HUD_TRANSFORM.* release/
          cp experiments/fonts/clean-joins/report.json release/FONT_REPORT_1.0.9.json
          cp prepared/build/report/BUILD_REPORT.md release/
          cp prepared/build/report/CHANGELOG.md release/
          cp prepared/PAYLOAD_PACK.json release/
          cp prepared/apps/manager/data/manifest.json release/INSTALL_MANIFEST_1.0.9.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('release')
          reports=[json.loads(p.read_text()) for p in root.glob('PACKAGED-*.json')]
          assert len(reports)==2 and all(x['passed'] for x in reports)
          assert len(list(root.glob('KH2FM-Arabic-1.0.9-Windows-*.exe')))==1
          assert len(list(root.glob('KH2FM-Arabic-1.0.9-Linux-*.AppImage')))==1
          lines=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='SHA256SUMS.txt':
                  with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
                  lines.append(digest+'  '+p.name)
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PY
          python build/tools/assemble_manager_release.py release
      - name: Verify assets and publish the full 1.0.9 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.9 -R "$GITHUB_REPOSITORY" --json isDraft > release-info.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-info.json"))["isDraft"], "The owner already published 1.0.9; refusing to modify it"'
            gh release edit v1.0.9 --draft --prerelease=true --title v1.0.9 --target "$GITHUB_SHA" --notes-file docs/releases/1.0.9.md -R "$GITHUB_REPOSITORY"
            gh release upload v1.0.9 release/* --clobber -R "$GITHUB_REPOSITORY"
            # New downloads are uploaded before removing obsolete loose supporting files.
            gh release view v1.0.9 -R "$GITHUB_REPOSITORY" --json isDraft,assets > uploaded.json
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          release = json.load(open('uploaded.json'))
          assert release['isDraft'], 'The owner published the release; refusing cleanup'
          expected = {p.name for p in Path('release').iterdir() if p.is_file()}
          assert expected.issubset({a['name'] for a in release['assets']})
          for asset in release['assets']:
              if asset['name'] not in expected:
                  subprocess.run(['gh', 'release', 'delete-asset', 'v1.0.9', asset['name'], '--yes'], check=True)
          PY
          else
            gh release create v1.0.9 release/* --draft --prerelease --title v1.0.9 --target "$GITHUB_SHA" --notes-file docs/releases/1.0.9.md -R "$GITHUB_REPOSITORY"
          fi
          gh release view v1.0.9 -R "$GITHUB_REPOSITORY" --json isDraft,url,assets > result.json
          python -c 'import json; from pathlib import Path; r=json.load(open("result.json")); assert r["isDraft"]; names=sorted(a["name"] for a in r["assets"]); assert names==sorted(p.name for p in Path("release").iterdir()); assert len(names)==3 and names[0].startswith("01-") and names[0].endswith(".exe"); print(r["url"])'
          gh release edit v1.0.9 --draft=false --prerelease=true -R "$GITHUB_REPOSITORY"
          gh release view v1.0.9 -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url,assets > published.json
          python -c 'import json; r=json.load(open("published.json")); assert not r["isDraft"] and r["isPrerelease"]; assert len(r["assets"])==3; print(r["url"])'
