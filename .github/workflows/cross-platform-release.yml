name: KH2FM 1.0.3 — Windows macOS Linux
on:
  push:
    branches: ['installer/**']
    paths: ['apps/manager/**', '.github/workflows/cross-platform-release.yml', 'docs/releases/1.0.3.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kh2fm-draft-1-0-3
  cancel-in-progress: false
env:
  VERSION: '1.0.3'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
jobs:
  payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the translation and download its frozen sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_corrections.py > validation.txt
          tail -n 3 validation.txt
          gh release download build-payload -p build-payload-1.0.0-beta.zip -D "$RUNNER_TEMP" -R "$GITHUB_REPOSITORY"
          mkdir -p build/payload
          unzip -q "$RUNNER_TEMP/build-payload-1.0.0-beta.zip" -d build/payload
          python build/tools/verify_payload.py build/payload
          python build/tools/selftest.py build/payload/kh2/msg/us
          python build/tools/build_bars.py --payload build/payload --version "$VERSION"
          python build/tools/fetch_panacea.py
          python apps/manager/scripts/pack_payload.py > PAYLOAD_PACK.json
          cat PAYLOAD_PACK.json
      - uses: actions/upload-artifact@v4
        with:
          name: manager-data
          compression-level: 0
          path: |
            apps/manager/data/
            build/report/
            PAYLOAD_PACK.json
          if-no-files-found: error
  apps:
    needs: payload
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win32, arch: x64, target: '--win --x64'}
          - {os: macos-15-intel, platform: darwin, arch: x64, target: '--mac --x64'}
          - {os: macos-15, platform: darwin, arch: arm64, target: '--mac --arm64'}
          - {os: ubuntu-24.04, platform: linux, arch: x64, target: '--linux --x64'}
          - {os: ubuntu-24.04-arm, platform: linux, arch: arm64, target: '--linux --arm64'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/manager/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: manager-data
          path: prepared
      - name: Restore the verified translation resources
        run: |
          mkdir -p data test-results
          cp ../../prepared/apps/manager/data/* data/
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Files, legacy upgrades, rollback, recovery and Wine registry tests
        run: node scripts/run_checked.cjs npm test
      - name: Native application button tests (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/run_checked.cjs npm run test:native
      - name: Native application button tests (Windows and macOS)
        if: matrix.platform != 'linux'
        run: node scripts/run_checked.cjs npm run test:native
      - name: Build the downloadable application
        run: node scripts/run_checked.cjs npm run dist -- ${{ matrix.target }}
      - name: Exercise the packaged application and all 798 actual mod files (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/run_checked.cjs node tests/packaged.cjs
      - name: Exercise the packaged application and all 798 actual mod files (Windows and macOS)
        if: matrix.platform != 'linux'
        run: node scripts/run_checked.cjs node tests/packaged.cjs
      - name: Collect downloads and actual application evidence
        run: python ../../build/tools/collect_manager_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 0
          path: apps/manager/release-output/
          if-no-files-found: error
  draft:
    needs: [payload, apps]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: manager-data
          path: prepared
      - name: Collect documentation and calculate asset hashes
        run: |
          cp apps/manager/README_AR.md release/
          cp apps/manager/REPORT_1.0.3.md release/
          cp prepared/build/report/BUILD_REPORT.md release/
          cp prepared/build/report/CHANGELOG.md release/
          cp prepared/PAYLOAD_PACK.json release/
          cp prepared/apps/manager/data/manifest.json release/INSTALL_MANIFEST_1.0.3.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('release')
          reports=[json.loads(p.read_text()) for p in root.glob('PACKAGED-*.json')]
          assert len(reports)==5 and all(x['passed'] for x in reports)
          assert len(list(root.glob('KH2FM-Arabic-1.0.3-Windows-*.exe')))==1
          assert len(list(root.glob('KH2FM-Arabic-1.0.3-macOS-*.dmg')))==2
          assert len(list(root.glob('KH2FM-Arabic-1.0.3-Linux-*.AppImage')))==2
          lines=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='SHA256SUMS.txt':
                  with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
                  lines.append(digest+'  '+p.name)
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PY
      - name: Create or update only the 1.0.3 draft (the owner publishes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.3 -R "$GITHUB_REPOSITORY" --json isDraft > release-info.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-info.json"))["isDraft"], "The owner already published 1.0.3; refusing to modify it"'
            gh release edit v1.0.3 --draft --prerelease=false --title v1.0.3 --target "$GITHUB_SHA" --notes-file docs/releases/1.0.3.md -R "$GITHUB_REPOSITORY"
            gh release upload v1.0.3 release/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create v1.0.3 release/* --draft --title v1.0.3 --target "$GITHUB_SHA" --notes-file docs/releases/1.0.3.md -R "$GITHUB_REPOSITORY"
          fi
          gh release view v1.0.3 -R "$GITHUB_REPOSITORY" --json isDraft,url,assets > result.json
          python -c 'import json; r=json.load(open("result.json")); assert r["isDraft"]; assert len(r["assets"])>=20; print(r["url"])'
