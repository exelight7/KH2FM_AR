name: KH2FM 2.0.1 — Windows Linux
on:
  push:
    branches: ['installer/**']
    paths: ['apps/manager/**', 'build/tools/*manager_release.py', '.github/workflows/cross-platform-release.yml', 'docs/releases/2.0.1.md', 'experiments/fonts/alef-spacing/**', 'experiments/fonts/outline-baseline/**', 'experiments/fonts/dialogue-size/**', 'experiments/fonts/natural-proportions/**', 'experiments/fonts/clean-joins/**', 'experiments/fonts/menu-legibility/**', 'experiments/fonts/menu-alignment/**', 'experiments/fonts/menu-fine-alignment/**', 'experiments/fonts/menu-lower-baseline/**', 'experiments/fonts/menu-context-alignment/**', 'build/tools/align_green_commands.py', 'build/config/green-command-layout.json', 'build/tools/clean_title_lines.py', 'build/tools/enlarge_commands.py', 'build/tools/replace_command_labels.py', 'build/tools/replace_drive_hud.py', 'build/tools/*font*.py', 'corrections/**', 'build/docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kh2fm-draft-2-0-1
  cancel-in-progress: true
env:
  VERSION: '2.0.1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
jobs:
  payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the translation and download its frozen sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_corrections.py > validation.txt
          tail -n 3 validation.txt
          gh release download build-payload -p build-payload-1.0.0-beta.zip -D "$RUNNER_TEMP" -R "$GITHUB_REPOSITORY"
          mkdir -p build/payload
          unzip -q "$RUNNER_TEMP/build-payload-1.0.0-beta.zip" -d build/payload
          python build/tools/verify_payload.py build/payload
          python build/tools/selftest.py build/payload/kh2/msg/us
          python build/tools/build_bars.py --payload build/payload --version "$VERSION"
          python -m pip install Pillow==12.3.0 numpy==2.5.3
          python experiments/fonts/outline-baseline/sources/fix_font.py --verify
          python experiments/fonts/dialogue-size/sources/scale_font.py --verify
          python experiments/fonts/natural-proportions/sources/build_font.py --verify
          python experiments/fonts/clean-joins/sources/build_font.py --verify
          python experiments/fonts/menu-legibility/sources/build_font.py --verify
          python experiments/fonts/menu-alignment/sources/align_font.py --verify
          python experiments/fonts/menu-fine-alignment/sources/align_font.py --verify
          python experiments/fonts/menu-lower-baseline/sources/align_font.py --verify
          python experiments/fonts/menu-context-alignment/sources/fix_separator.py --verify
          python build/tools/merge_font_overlay.py
          python build/tools/enlarge_commands.py
          python build/tools/replace_command_labels.py
          python build/tools/replace_drive_hud.py
          python build/tools/clean_title_lines.py
          python build/tools/align_green_commands.py
          python build/tools/package_place_shadow.py
          python build/tools/package_green_text.py
          python build/tools/fetch_panacea.py
          python apps/manager/scripts/pack_payload.py > PAYLOAD_PACK.json
          cat PAYLOAD_PACK.json
      - uses: actions/upload-artifact@v4
        with:
          name: manager-data
          compression-level: 0
          path: |
            apps/manager/data/
            build/report/
            PAYLOAD_PACK.json
          if-no-files-found: error
  apps:
    needs: payload
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win32, arch: x64, target: '--win --x64'}
          - {os: ubuntu-24.04, platform: linux, arch: x64, target: '--linux --x64'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/manager/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: manager-data
          path: prepared
      - name: Restore the verified translation resources
        run: |
          mkdir -p data test-results
          cp ../../prepared/apps/manager/data/* data/
      - name: Install pinned build dependencies
        run: npm ci --no-audit --no-fund
      - name: Files, legacy upgrades, rollback, recovery and Wine registry tests
        run: node scripts/run_checked.cjs npm test
      - name: Native application button tests (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/run_checked.cjs npm run test:native
      - name: Native application button tests (Windows and macOS)
        if: matrix.platform != 'linux'
        run: node scripts/run_checked.cjs npm run test:native
      - name: Native place-shadow guard and two-byte scope tests (Windows)
        if: matrix.platform == 'win32'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /std:c17 /DPLACE_TEST ../../native/place-text-shadow/place_shadow.c /Fe:test-results/place-shadow-test.exe > test-results/PLACE_SHADOW_TEST.txt 2>&1
          if errorlevel 1 exit /b 1
          test-results\place-shadow-test.exe >> test-results/PLACE_SHADOW_TEST.txt
          if errorlevel 1 exit /b 1
      - name: Native green command scope, guards and actual label corpus (Windows)
        if: matrix.platform == 'win32'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /std:c17 /DGREEN_TEST ../../native/green-command-text/green_text.c /Fe:test-results/green-text-test.exe > test-results/GREEN_TEXT_TEST.txt 2>&1
          if errorlevel 1 exit /b 1
          test-results\green-text-test.exe >> test-results/GREEN_TEXT_TEST.txt
          if errorlevel 1 exit /b 1
          cl /nologo /O2 /std:c17 /LD /DGREEN_TEST_API ../../native/green-command-text/green_text.c /link /OUT:test-results/green-normalizer-test.dll >> test-results/GREEN_TEXT_TEST.txt 2>&1
          if errorlevel 1 exit /b 1
          python ../../native/green-command-text/test_corpus.py --library test-results/green-normalizer-test.dll --data data --output test-results/GREEN_CORPUS.json
          if errorlevel 1 exit /b 1
      - name: Build the downloadable application
        run: node scripts/run_checked.cjs npm run dist -- ${{ matrix.target }}
      - name: Exercise the packaged application and all 831 actual mod files (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node scripts/run_checked.cjs node tests/packaged.cjs
      - name: Exercise the packaged application and all 831 actual mod files (Windows and macOS)
        if: matrix.platform != 'linux'
        run: node scripts/run_checked.cjs node tests/packaged.cjs
      - name: Collect downloads and actual application evidence
        run: python ../../build/tools/collect_manager_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 0
          path: apps/manager/release-output/
          if-no-files-found: error
  draft:
    needs: [payload, apps]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: manager-data
          path: prepared
      - name: Collect documentation and calculate asset hashes
        run: |
          cp apps/manager/README_AR.md release/
          cp apps/manager/REPORT_2.0.1.md release/
          cp experiments/fonts/menu-context-alignment/comparison-*.png release/
          cp prepared/build/report/REACTION_COMMANDS.json release/
          cp prepared/build/report/GREEN_COMMAND_LAYOUT.json release/
          cp prepared/build/report/PLACE_TEXT_SHADOW.json release/
          cp prepared/build/report/GREEN_COMMAND_TEXT.json release/
          cp prepared/build/report/HUD_COMMANDS.* release/
          cp prepared/build/report/HUD_TRANSFORM.* release/
          cp prepared/build/report/TITLE_CLEANUP.* release/
          cp experiments/fonts/menu-context-alignment/report.json release/FONT_REPORT_2.0.1.json
          cp prepared/build/report/BUILD_REPORT.md release/
          cp prepared/build/report/CHANGELOG.md release/
          cp prepared/PAYLOAD_PACK.json release/
          cp prepared/apps/manager/data/manifest.json release/INSTALL_MANIFEST_2.0.1.json
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('release')
          reports=[json.loads(p.read_text()) for p in root.glob('PACKAGED-*.json')]
          assert len(reports)==2 and all(x['passed'] for x in reports)
          assert len(list(root.glob('KH2FM-Arabic-2.0.1-Windows-*.exe')))==1
          assert len(list(root.glob('KH2FM-Arabic-2.0.1-Linux-*.AppImage')))==1
          lines=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='SHA256SUMS.txt':
                  with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
                  lines.append(digest+'  '+p.name)
          (root/'SHA256SUMS.txt').write_text('\n'.join(lines)+'\n')
          PY
          python build/tools/assemble_manager_release.py release
          python - <<'PY'
          import json,base64,hashlib
          from pathlib import Path
          root=Path('release')
          for name in ['latest.yml','latest-linux.yml']:
              metadata=json.loads((root/name).read_text())
              assert metadata['version']=='2.0.1' and len(metadata['files'])==1
              file=metadata['files'][0]; binary=root/file['url']
              with binary.open('rb') as stream: digest=base64.b64encode(hashlib.file_digest(stream,'sha512').digest()).decode()
              assert file['sha512']==digest and file['size']==binary.stat().st_size
              assert metadata['path']==binary.name
          PY
      - name: Verify assets and prepare the 2.0.1 release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.1 -R "$GITHUB_REPOSITORY" --json isDraft > release-info.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-info.json"))["isDraft"], "The owner already published 2.0.1; refusing to modify it"'
            gh release edit v2.0.1 --draft --prerelease=false --title v2.0.1 --target "$GITHUB_SHA" --notes-file docs/releases/2.0.1.md -R "$GITHUB_REPOSITORY"
            gh release upload v2.0.1 release/* --clobber -R "$GITHUB_REPOSITORY"
            # New downloads are uploaded before removing obsolete loose supporting files.
            gh release view v2.0.1 -R "$GITHUB_REPOSITORY" --json isDraft,assets > uploaded.json
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          release = json.load(open('uploaded.json'))
          assert release['isDraft'], 'The owner published the release; refusing cleanup'
          expected = {p.name for p in Path('release').iterdir() if p.is_file()}
          assert expected.issubset({a['name'] for a in release['assets']})
          for asset in release['assets']:
              if asset['name'] not in expected:
                  subprocess.run(['gh', 'release', 'delete-asset', 'v2.0.1', asset['name'], '--yes'], check=True)
          PY
          else
            gh release create v2.0.1 release/* --draft --title v2.0.1 --target "$GITHUB_SHA" --notes-file docs/releases/2.0.1.md -R "$GITHUB_REPOSITORY"
          fi
          gh release view v2.0.1 -R "$GITHUB_REPOSITORY" --json isDraft,url,assets > result.json
          python -c 'import json; from pathlib import Path; r=json.load(open("result.json")); assert r["isDraft"]; names=sorted(a["name"] for a in r["assets"]); assert names==sorted(p.name for p in Path("release").iterdir()); assert len(names)==5 and names[0].startswith("01-") and names[0].endswith(".exe"); print(r["url"])'
          # Publish after the green-row position has been checked in the actual game.
